name: Register

# Validates the tree at one commit and triggers JuliaRegistrator on it. This
# workflow reads the repository and posts a single commit comment; it never
# mutates a tracked file, pushes a branch, or creates a tag.
#
# The version bump in Project.toml and the promotion of `## [Unreleased]` to
# `## [X.Y.Z] - YYYY-MM-DD` in CHANGELOG.md land through an ordinary reviewed
# pull request, not from here. A commit pushed by a workflow using
# GITHUB_TOKEN starts no further workflow, so a bump written by CI would be the
# one commit on main that CI never runs against, and the registered tree would
# be the only untested tree in the history. Registering the commit that a
# reviewed pull request already turned green removes that hole, and this
# workflow re-runs the suite against that exact tree before it triggers.
#
# A green run means the trigger comment was posted. Registration itself can
# still fail afterwards (duplicate version, compat problems); JuliaRegistrator
# reports that as a reply on the commit comment thread and on the General pull
# request.
#
# Manual fallback, as a comment on the commit to register:
#
#     @JuliaRegistrator register
#
#     Release notes:
#
#     ## Breaking changes
#     ...

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character SHA of the commit to register. Must be the current tip of main.
        required: true
        type: string
      dry_run:
        description: Run every check and print the trigger comment without posting it.
        required: false
        type: boolean
        default: false

# Creating a commit comment is a repository-contents write. Nothing else here
# needs a write scope.
permissions:
  contents: write

# Two registrations at once would each pass their own pre-flight against
# General and then post conflicting triggers. Never cancel a run that may
# already have posted.
concurrency:
  group: register
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  register:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      # Checks out the exact commit named by the dispatch, not a branch tip that
      # could move between validation and trigger. The full history is needed so
      # that the tests see the same tree a tagged checkout will.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the commit is the tip of main
        run: |
          set -euo pipefail
          if ! printf '%s' "$EXPECTED_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::expected_sha must be a full 40-character lowercase hex SHA, got '$EXPECTED_SHA'"
            exit 1
          fi
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$main_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::expected_sha $EXPECTED_SHA is not the tip of main ($main_sha). Re-read the tip with 'git fetch origin && git rev-parse origin/main' and dispatch again."
            exit 1
          fi
          echo "Registering $EXPECTED_SHA, the current tip of main."

      - name: Read the version from Project.toml
        id: version
        run: |
          set -euo pipefail
          line=$(grep -m1 -E '^version[[:space:]]*=' Project.toml || true)
          if [ -z "$line" ]; then
            echo "::error::Project.toml has no version key"
            exit 1
          fi
          version=$(printf '%s' "$line" | sed -E 's/.*"([^"]*)".*/\1/')
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Project.toml version must be X.Y.Z, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Project.toml version is $version"

      # The release notes are the changelog section for this version, verbatim
      # and without its heading. They are written to a file and passed on by
      # path: a changelog line is arbitrary text and must not be interpolated
      # into a shell command or fenced by a heredoc delimiter it could contain.
      - name: Extract and validate the changelog section
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          heading_line() { sed -n "${1}p" CHANGELOG.md | sed -E 's/^##[[:space:]]*//; s/[[:space:]]+$//'; }

          section_body() {
            local start end
            start=$(( $1 + 1 ))
            end="${2:-0}"
            if [ "$end" -gt 0 ]; then
              end=$(( end - 1 ))
              if [ "$end" -lt "$start" ]; then return 0; fi
              sed -n "${start},${end}p" CHANGELOG.md
            else
              sed -n "${start},\$p" CHANGELOG.md
            fi
          }

          mapfile -t heads < <(grep -n '^## ' CHANGELOG.md | cut -d: -f1)
          if [ "${#heads[@]}" -eq 0 ]; then
            echo "::error::CHANGELOG.md has no '## ' section headings"
            exit 1
          fi

          # An `## [Unreleased]` heading may sit above the release section as
          # long as it is empty. A non-empty one means the release pull request
          # promoted the version in Project.toml but left the entries behind.
          idx=0
          if printf '%s' "$(heading_line "${heads[0]}")" | grep -qiE '^\[?unreleased\]?'; then
            if section_body "${heads[0]}" "${heads[1]:-0}" | grep -q '[^[:space:]]'; then
              echo "::error::the '## [Unreleased]' section is not empty. Rename it to '## [$VERSION] - YYYY-MM-DD' in the release pull request, or move its entries into that section."
              exit 1
            fi
            idx=1
          fi

          if [ -z "${heads[$idx]:-}" ]; then
            echo "::error::CHANGELOG.md has no section below '## [Unreleased]'"
            exit 1
          fi

          title=$(heading_line "${heads[$idx]}")
          escaped=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          if ! printf '%s' "$title" | grep -qE "^\[?${escaped}\]?([[:space:]]*-[[:space:]]*[0-9]{4}-[0-9]{2}-[0-9]{2})?\$"; then
            echo "::error::the top CHANGELOG.md section is '## $title', expected '## $VERSION', '## [$VERSION]' or '## [$VERSION] - YYYY-MM-DD'"
            exit 1
          fi

          notes="${RUNNER_TEMP}/release-notes.md"
          section_body "${heads[$idx]}" "${heads[$(( idx + 1 ))]:-0}" > "$notes"

          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md section $VERSION is empty"
            exit 1
          fi
          if ! grep -qE '^[[:space:]]*[-*][[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md section $VERSION must list at least one '- ' or '* ' bullet"
            exit 1
          fi
          # Every pre-1.0 minor bump is a breaking release. General's AutoMerge
          # runs guideline_breaking_explanation, which holds a breaking version
          # whose trigger carries no explanation, and it recognises an
          # explanation by the words "breaking" or "changelog".
          if ! grep -qiE 'breaking|changelog' "$notes"; then
            echo "::error::CHANGELOG.md section $VERSION must mention 'breaking' or 'changelog'. General's AutoMerge check guideline_breaking_explanation blocks a breaking release whose notes do not describe the break, and every pre-1.0 minor bump is breaking."
            exit 1
          fi

          echo "notes_file=$notes" >> "$GITHUB_OUTPUT"
          echo "Release notes ($(wc -l < "$notes") lines):"
          cat "$notes"

      - name: Check the version against the General registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          url=https://raw.githubusercontent.com/JuliaRegistries/General/master/P/PowerDiff/Versions.toml
          file="${RUNNER_TEMP}/Versions.toml"
          code=$(curl -sSL --retry 3 -o "$file" -w '%{http_code}' "$url")
          if [ "$code" = "404" ]; then
            echo "PowerDiff is not in General yet; $VERSION is the first registration."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::could not read General's Versions.toml for PowerDiff (HTTP $code)"
            exit 1
          fi
          # Each registered version is a TOML table header: ["0.1.0"].
          registered=$(sed -nE 's/^\["([0-9]+\.[0-9]+\.[0-9]+)"\].*/\1/p' "$file")
          echo "Registered versions: $(printf '%s' "$registered" | tr '\n' ' ')"
          if printf '%s\n' "$registered" | grep -qxF "$VERSION"; then
            echo "::error::version $VERSION is already registered in General"
            exit 1
          fi
          newest=$(printf '%s\n' "$registered" | sort -V | tail -1)
          if [ -n "$newest" ]; then
            highest=$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -1)
            if [ "$highest" != "$VERSION" ]; then
              echo "::error::version $VERSION is lower than $newest, the newest version registered in General"
              exit 1
            fi
          fi
          echo "$VERSION is new and higher than every registered version."

      - name: Check that the tag does not exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists. TagBot creates the tag after registration, so an existing tag means this version was already released."
            exit 1
          fi
          echo "Tag v$VERSION is free."

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      # The suite runs against the exact tree being registered. Coverage is
      # instrumented in CI; a release gate only needs the pass or fail.
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
        with:
          coverage: false

      - name: Check for an existing Registrator trigger
        id: dedupe
        run: |
          set -euo pipefail
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/comments" \
            --jq '[.[] | select(.body | test("@JuliaRegistrator\\s+register"; "i"))] | length' \
            | awk '{ total += $1 } END { print total + 0 }')
          echo "existing=$existing" >> "$GITHUB_OUTPUT"
          if [ "$existing" -gt 0 ]; then
            echo "::notice::$EXPECTED_SHA already carries $existing Registrator trigger comment(s); the trigger step will be skipped."
          fi

      - name: Trigger JuliaRegistrator
        if: steps.dedupe.outputs.existing == '0'
        env:
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          payload="${RUNNER_TEMP}/trigger.json"
          # jq -Rs reads the notes as one raw string, so the changelog text is
          # JSON-encoded rather than passing through any shell expansion.
          jq -Rs '{body: ("@JuliaRegistrator register\n\nRelease notes:\n\n" + .)}' \
            < "$NOTES_FILE" > "$payload"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run. The comment below would be posted on $EXPECTED_SHA:"
            jq -r .body < "$payload"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/comments" \
            --method POST --input - < "$payload"
          echo "Triggered JuliaRegistrator on $EXPECTED_SHA."
