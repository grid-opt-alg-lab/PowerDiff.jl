name: Documentation

on:
  push:
    branches: [main]
    # Only release tags. Documenter maps `vX.Y.Z` to a versioned docs directory
    # on gh-pages; any other tag name produces a build it has no slot for.
    tags: ['v*']
  pull_request:

# A docs build always publishes the same target for a given ref, so an
# in-flight build for that ref is already obsolete once a newer one starts.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # Documenter needs `contents: write` to push the built site to gh-pages and
    # `statuses: write` to attach the preview link to the pull request head
    # commit; `pull-requests: read` lets it resolve the pull request number for
    # the preview path. It needs no Actions API access: `actions: write` would
    # only let julia-actions/cache prune superseded caches, which it attempts
    # solely off the default branch and tolerates failing, and which GitHub's
    # own 7-day and 10 GB cache eviction already covers.
    permissions:
      contents: write
      statuses: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1'
      # Caches ~/.julia/artifacts. A docs build loads PowerDiff, which loads
      # PowerIO and so fetches its lazy native-library artifact.
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      # docs/Project.toml carries `[sources] PowerDiff = {path = ".."}`, which
      # resolves PowerDiff to this checkout, so instantiate is the whole install
      # and `Pkg.develop` would be a no-op. `install-package: false` below
      # suppresses the docdeploy action's own develop-plus-instantiate step.
      - name: Instantiate the docs environment
        run: julia --color=yes --project=docs -e 'using Pkg; Pkg.instantiate()'
      - uses: julia-actions/julia-docdeploy@e62cc8fd639797a0c2922a437d5b1b81c4a12787 # v1.3.1
        with:
          install-package: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
